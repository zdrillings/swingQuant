    params:
      window: 20
  - name: close_vs_last_earnings_close
    type: close_vs_last_earnings_close
  market_context:
  - name: spy_roc_20
    ticker: SPY
    type: reference_return
    params:
      window: 20
  - name: spy_roc_5
    ticker: SPY
    type: reference_return
    params:
      window: 5
  - name: spy_realized_vol_20
    ticker: SPY
