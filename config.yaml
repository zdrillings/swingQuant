features:
  trend:
  - name: sma_50_dist
    type: pct_diff
    params:
      window: 50
  - name: sma_200_dist
    type: pct_diff
    params:
      window: 200
  - name: ma_alignment_50_200
    type: moving_average_gap
    params:
      short_window: 50
      long_window: 200
  - name: ma_slope_50_20
    type: moving_average_slope
    params:
      window: 50
      slope_window: 20
  - name: ma_slope_200_20
    type: moving_average_slope
    params:
      window: 200
      slope_window: 20
  - name: atr_14
    type: atr
    params:
      window: 14
  - name: atr_pct_14
    type: atr_pct
    params:
      window: 14
  - name: atr_pct_14_percentile_252
    type: rolling_percentile
    params:
      source_column: atr_pct_14
      window: 252
  - name: realized_vol_20_percentile_252
    type: realized_volatility_percentile
    params:
      return_window: 20
      percentile_window: 252
  momentum:
  - name: rsi_14
    type: rsi
    params:
      window: 14
  - name: rsi_2
    type: rsi
    params:
      window: 2
  - name: ret_1d
    type: roc
    params:
      window: 1
  - name: ret_5d
    type: roc
    params:
      window: 5
  - name: roc_63
    type: roc
    params:
      window: 63
  - name: roc_126
    type: roc
    params:
      window: 126
  - name: relative_strength_index_vs_spy
    ticker: SPY
    type: relative_strength_percentile
    params:
      window: 63
  - name: relative_strength_index_vs_qqq
    ticker: QQQ
    type: relative_strength_percentile
    params:
      window: 63
  - name: relative_strength_index_vs_xlk
    ticker: XLK
    type: relative_strength_percentile
    params:
      window: 63
  - name: relative_strength_index_vs_subindustry
    type: relative_strength_percentile_contextual
    params:
      window: 63
      benchmark_column: subindustry_benchmark
  - name: rs_vs_spy_5d_change
    type: feature_change
    params:
      source_column: relative_strength_index_vs_spy
      periods: 5
  - name: rs_vs_qqq_5d_change
    type: feature_change
    params:
      source_column: relative_strength_index_vs_qqq
      periods: 5
  - name: rs_vs_xlk_5d_change
    type: feature_change
    params:
      source_column: relative_strength_index_vs_xlk
      periods: 5
  - name: rs_vs_subindustry_5d_change
    type: feature_change
    params:
      source_column: relative_strength_index_vs_subindustry
      periods: 5
  - name: rs_vs_subindustry_10d_change
    type: feature_change
    params:
      source_column: relative_strength_index_vs_subindustry
      periods: 10
  volume:
  - name: vol_alpha
    type: ratio_to_avg
    params:
      window: 20
  - name: breakout_volume_ratio_50
    type: ratio_to_avg
    params:
      window: 50
  - name: base_volume_dryup_ratio_20
    type: volume_dryup_ratio
    params:
      recent_window: 10
      prior_window: 10
  - name: dollar_volume_ratio_20_60
    type: dollar_volume_ratio
    params:
      short_window: 20
      long_window: 60
  - name: volume_percentile_60
    type: rolling_percentile
    params:
      source_column: volume
      window: 60
  price_structure:
